<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YVAKOR · Galeria</title>
<style>
:root{--agua:#3fbfae;--sol:#d9a441;--bg:#070d12;--card:#0c1a22;--linha:#1b2b35;--txt:#dceaf0;--dim:#7f96a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 90% at 50% 0,#0d1a22,#050a0e 70%);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha);background:#08121a}
header h1{margin:0;font-size:17px}header .dot{width:9px;height:9px;border-radius:50%;background:var(--agua);box-shadow:0 0 10px var(--agua)}
header .dir{margin-left:auto;color:var(--dim);font-size:12px}
main{padding:16px 18px 30px}h2{font-size:14px;color:var(--sol);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;overflow:hidden;transition:transform .12s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--agua)}
.card img,.card object{width:100%;height:170px;object-fit:contain;background:#050b0f;display:block}
.card .meta{padding:8px 10px;font-size:11px;color:var(--dim);word-break:break-all}
.card a{color:var(--txt);text-decoration:none}.vazio{color:var(--dim);font-size:13px}
</style>
<style id="tema-claude">
/* tema Claude (claro/escuro) — paletas e componentes das páginas secundárias */
@font-face{font-family:'Inter';src:url('/fonts/Inter.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'Lora';src:url('/fonts/Lora.ttf') format('truetype');font-weight:400 700;font-display:swap}
:root{--bg:#faf9f5;--card:#fff;--linha:rgba(31,30,29,.12);--txt:#1f1e1d;--dim:#6b6a64;--agua:#4d8a5f;--sol:#c96442;--lateral:#f5f4ee;--sombra:rgba(0,0,0,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--linha:rgba(250,249,245,.12);--txt:#faf9f5;--dim:#a8a69e;--agua:#7fbf8f;--sol:#d97757;--lateral:#1f1e1d;--sombra:rgba(0,0,0,.3);color-scheme:dark}}
body{background:var(--bg)!important;color:var(--txt)!important;font-family:'Inter','Segoe UI',system-ui,sans-serif!important}
header{background:var(--lateral)!important;border-bottom:1px solid var(--linha)!important}
header h1,header b{font-family:'Lora',Georgia,serif!important;font-weight:500!important;letter-spacing:0!important;font-size:19px!important}
.dot,.led{background:var(--sol)!important;box-shadow:none!important}
.dir,.ip{color:var(--dim)!important}
h2{color:var(--txt)!important;text-transform:none!important;letter-spacing:0!important;font-family:'Lora',Georgia,serif!important;font-weight:500!important;font-size:19px!important}
aside h3{color:var(--txt)!important;text-transform:none!important;letter-spacing:0!important;font-family:'Lora',Georgia,serif!important;font-weight:500!important;font-size:16px!important}
.card,aside,.item,.lateral{background:var(--card)!important;border:1px solid var(--linha)!important;color:var(--txt)!important;border-radius:14px!important}
.lateral{border-radius:0!important;border-width:0 0 0 1px!important;box-shadow:-12px 0 40px var(--sombra)}
.card:hover,.item:hover{border-color:var(--sol)!important}
.card img,.card object,.tela,.tela img,.tela video{background:var(--lateral)!important}
.card a,.item,.item small{color:var(--txt)!important}.card .meta,.item small{color:var(--dim)!important}
a{color:var(--sol)}a[style*="color"]{color:var(--sol)!important}
button{background:var(--card)!important;color:var(--txt)!important;border:1px solid var(--linha)!important;border-radius:10px!important}
button:hover{border-color:var(--sol)!important}
button.primario{background:var(--sol)!important;color:#fff!important;border-color:var(--sol)!important}
button[style*="color"]{color:#b4443b!important}
input,select,textarea{background:var(--card)!important;color:var(--txt)!important;border:1px solid var(--linha)!important;border-radius:10px!important}
input:focus,select:focus,textarea:focus{border-color:var(--sol)!important;outline:none}
.pre{background:var(--lateral)!important;color:var(--txt)!important;border-color:var(--linha)!important}
.badge{border-color:var(--linha)!important;color:var(--dim)!important}
.badge.on{color:var(--agua)!important;border-color:var(--agua)!important}
.badge.off{color:#b4443b!important;border-color:#b4443b!important}
.badge.fav{color:var(--sol)!important;border-color:var(--sol)!important}
.vazio{color:var(--dim)!important}
</style>
<header><span class="dot"></span><h1>Galeria de capacidades</h1><span class="dir" id="contagem"></span>
<a href="/api/galeria/zip?tipo=graficos" style="margin-left:10px;color:#3fbfae;font-size:12px">ZIP gráficos</a>
<a href="/api/galeria/zip?tipo=imagens" style="margin-left:10px;color:#3fbfae;font-size:12px">ZIP imagens</a></header>
<main>
  <h2>Gráficos</h2><div id="graficos" class="grid"><div class="vazio">carregando…</div></div>
  <h2>Imagens</h2><div id="imagens" class="grid"><div class="vazio">carregando…</div></div>
</main>
<script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function carregar(){
  try{
    const r=await fetch("/api/galeria"); const j=await r.json();
    const g=j.itens.filter(i=>i.tipo==="graficos"), im=j.itens.filter(i=>i.tipo==="imagens");
    document.getElementById("contagem").textContent=`${g.length} gráficos · ${im.length} imagens`;
    const card=(i,suf)=>`<div class="card"><a href="${i.url}" target="_blank">${suf===".svg"?`<object data="${i.url}" type="image/svg+xml"></object>`:`<img src="${i.url}" loading="lazy">`}</a><div class="meta"><a href="${i.url}" target="_blank">${esc(i.nome)}</a><br>${i.kb} KB · ${esc(i.quando)} · <a href="#" onclick="apagar('${i.tipo}','${esc(i.nome)}');return false" style="color:#ff9c9c">apagar</a></div></div>`;
    document.getElementById("graficos").innerHTML=g.length?g.map(i=>card(i,i.nome.slice(-4))).join(""):'<div class="vazio">nenhum gráfico ainda</div>';
    document.getElementById("imagens").innerHTML=im.length?im.map(i=>card(i,i.nome.slice(-4))).join(""):'<div class="vazio">nenhuma imagem ainda</div>';
  }catch(e){document.getElementById("graficos").innerHTML='<div class="vazio">falha ao listar</div>';}
}
carregar();
async function apagar(tipo,nome){ if(!confirm("Apagar "+nome+"?"))return; const r=await fetch("/api/galeria/apagar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo,nome})}); const j=await r.json(); if(j.ok) carregar(); else alert(j.erro||"falha"); }
</script></html>
