# YVAKOR — Configuração central
# Ajuste aqui sem tocar em código.

agent:
  name: "YVAKOR"
  language: "pt-BR"
  max_iterations: 25         # limite de ciclos por tarefa (navegar exige mais passos)
  timeout_s: 180             # teto duro por execução do agente
  reflection_enabled: true   # loop de autoavaliação pós-tarefa
  avaliar_auto: true         # avalia qualidade da resposta em segundo plano
  # Aprender/avaliar em segundo plano quando só há o modelo local (modo "local"
  # ou nuvem fora). Padrão false: o 3B em CPU leva minutos por extração e
  # competiria com o chat pela CPU. Ligue se tiver um modelo local rápido.
  aprender_local: false
  ferramentas_nativas: false # opt-in: o provedor atual trava com tools; JSON é o padrão
  router_ferramentas: true   # envia somente as ferramentas relevantes
  max_ferramentas: 14        # teto por mensagem
  # Método de raciocínio (yvakor/raciocinio.py): entender → planejar → agir
  # passo a passo → diagnosticar erros → verificar → responder com honestidade.
  raciocinio:
    planejar: true           # plano explícito antes de tarefas de vários passos (+1 chamada)
    verificar: true          # confere o resultado antes da resposta final (+1 chamada)
    # Modo plano: mostra o plano e espera "Aprovar e executar" / "Cancelar" /
    # ajuste em texto. auto = só quando há passo arriscado (enviar, apagar,
    # comprar, publicar…) ou quando você pede "me mostre o plano antes";
    # sempre = toda tarefa planejada; nunca = executa direto.
    aprovar_plano: auto

# Motor de contexto: seleciona o conteúdo relevante da página/arquivos.
contexto:
  max_caracteres: 5000       # orçamento do contexto no system prompt
  max_blocos: 32             # seções/parágrafos mantidos por mensagem

llm:
  # Modo de uso do modelo — o usuário troca em tempo de execução (rodapé da
  # interface / painel da extensão / POST /api/modelo) e a escolha é salva em
  # data/preferencias.json. Este valor é só o padrão de uma instalação nova:
  #   local    → só o modelo local (Ollama); nunca chama a nuvem   (PADRÃO)
  #   auto     → local primeiro; DeepSeek nas tarefas mais profundas
  #   deepseek → DeepSeek primeiro; o local entra se ele falhar
  modo_padrao: "local"
  default_provider: "ollama"

  providers:
    deepseek:
      base_url: "https://api.deepseek.com"
      model: "deepseek-chat"        # V4 (chat) | "deepseek-reasoner" p/ raciocínio
      api_key_env: "DEEPSEEK_API_KEY"
      temperature: 0.1             # 0.1 = mais determinístico e previsível para ferramentas
      max_tokens: 4096
    # Gemini (Google AI Studio) pela API compatível com OpenAI. Chave em
    # Ajustes → Chaves (GEMINI_API_KEY); sem chave ele fica fora da rota.
    # "gemini-flash-latest" acompanha o Flash mais novo; o teste da chave em
    # Ajustes diz se o modelo existe na sua conta.
    gemini:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model: "gemini-flash-latest"
      api_key_env: "GEMINI_API_KEY"
      temperature: 1.0             # o Google recomenda 1.0 nos Gemini 3 (abaixo disso pode entrar em laço)
      max_tokens: 8192             # o "pensamento" conta dentro deste teto
      extra:
        reasoning_effort: "low"    # pensa pouco: mais rápido e não come a saída
    # Ollama local — fallback e tarefas simples (sem custo de API).
    # Modelo 3B escolhido para esta máquina (4 núcleos, sem AVX2/GPU).
    ollama:
      base_url: "http://localhost:11434"
      model: "qwen2.5:3b"
      temperature: 0.2
      max_tokens: 512
      timeout_s: 50          # resposta local curta; acima disso cai para API
      # Threads de inferência: "auto" = núcleos-1 (em máquinas com 4+), deixando
      # um núcleo livre p/ a interface não engasgar enquanto o modelo gera.
      # Medido aqui (4 núcleos): 4 thr = 7,7 tok/s · 3 thr = 7,2 · 2 thr = 6,3.
      # Use um número fixo, ou 0 para desligar (volta ao endpoint /v1 padrão).
      num_thread: "auto"
      keep_alive: "5m"       # quanto o modelo fica na RAM após a última chamada
      num_ctx: 4096          # janela fixa: o padrão do Ollama CORTA o início do prompt em silêncio

  # Otimizador de consumo (yvakor/llm/economia.py): cache, roteamento aprendido
  # local→nuvem, compressão de prompt, teto de saída adaptativo, verificação de
  # qualidade e orçamento. Relatório em GET /api/consumo.
  otimizacao:
    ativo: true
    orcamento:                       # 0 = sem limite. Zonas: 70% econômico · 90% crítico · 100% bloqueado
      diario_usd: 0.50
      mensal_usd: 8.0
      # 0: sem teto de tokens — o gasto real já é limitado em US$ acima. Com
      # 600000, tarefas de navegador (≈4k tokens por passo) batiam 90% com só
      # US$ 0,09 gastos, a nuvem saía e a tarefa morria no Ollama fechado.
      diario_tokens: 0
    # Preços em USD por 1 milhão de tokens — CONFIRA na página de preços da API.
    precos_usd_por_milhao:
      deepseek: {entrada: 0.28, cache: 0.028, saida: 0.42}
      # gemini: sem preço aqui = o plano grátis do AI Studio não entra no
      # orçamento em US$. Se ativar cobrança, preencha com a tabela do Google.
    orcamento_prompt_tokens: {local: 1800, nuvem: 7000}

  # Roteador: LOCAL primeiro, DeepSeek para tarefas mais profundas.
  # - Tudo que NÃO está em 'external' é respondido pelo modelo local primeiro
  #   (conversa simples, resumo, classificação), com DeepSeek de reforço.
  # - As categorias em 'external' (código, arquitetura, análise complexa,
  #   pesquisa, prospecção) e o loop de ferramentas do agente vão direto ao
  #   DeepSeek, com o local de reforço. Mova categorias p/ fora de 'external'
  #   conforme o modelo local der conta delas.
  routing:
    local:    ["classificacao", "resumo_curto", "resposta_simples"]
    external: ["codigo", "arquitetura", "analise_complexa", "prospeccao", "pesquisa_sintese", "geracao_imagem"]
    fallback_order: ["deepseek", "gemini", "ollama"]   # se um falhar, tenta o próximo (sem chave = pulado)

memory:
  episodic_db: "data/yvakor_memory.db"
  semantic_index: "data/semantic"     # ChromaDB se instalado; senão keyword search
  semantic_top_k: 5
  episodic_context_last_n: 10         # últimas interações injetadas no contexto

skills:
  library_path: "skills_library"
  stable_threshold: 3                 # usos com sucesso p/ marcar skill estável

tools:
  sandbox_dir: "data/sandbox"
  # "protegido" (padrão) = toda ação destrutiva/externa pede confirmação.
  # "total" = o agente age com os MESMOS privilégios da sua conta (sem popup)
  # para ações de trabalho — MAS as ações de always_confirm continuam exigindo
  # confirmação mesmo em "total" (última linha de defesa). Tudo vai para
  # data/auditoria.jsonl. Troque para "total" por sua conta e risco.
  privilegios: "protegido"
  # Modo automático: executa ações de trabalho leves (copiar, criar pasta,
  # zipar, baixar) SEM pedir confirmação. As de always_confirm nunca.
  auto_approve: false
  # Estas NUNCA são aprovadas sozinhas — NEM em "total"/auto_approve. Pedem
  # confirmação via popup na interface (ou terminal). São os nomes REAIS das
  # ferramentas registradas (antes havia nomes que não casavam e, por isso,
  # nunca eram protegidos).
  always_confirm:
    # Mensagens e envios externos
    - "send_email"
    - "send_whatsapp"
    - "delete_file"
    # Arquivos do PC — escrita/edição/remoção/movência/extração fora do workspace
    - "arquivos_escrever"
    - "arquivos_editar"
    - "arquivos_apagar"
    - "arquivos_mover"
    - "arquivos_extrair"
    - "escrever_arquivo"
    - "escrever_arquivo_local"
    - "editar_arquivo_local"
    # Execução de código / shell no sistema
    - "executar_shell"
    - "executar_python"
    - "cap_executar_codigo"
    # Controle de dispositivos de rede (efeito físico / vigilância)
    - "rede_mqtt_publicar"
    - "rede_telefone_acao"
    - "rede_camera_credenciais"
    - "rede_camera_ptz"
    - "rede_camera_gravar"
    - "rede_camera_snapshot"
    - "rede_camera_janela"
    - "rede_http_dispositivo"
    - "rede_cast"
    - "rede_tv"
    - "rede_wol"
    - "rede_gerenciar"
    - "rede_dispositivo_atualizar"
    - "rede_dispositivo_esquecer"
  # Ações de trabalho que o guard também checa. Em "protegido"/auto_approve=false
  # pedem confirmação; sob "total"/auto_approve podem ser liberadas. As de
  # always_confirm acima são SEMPRE protegidas, estejam aqui ou não.
  guarded_actions:
    - "arquivos_copiar"
    - "arquivos_criar_pasta"
    - "arquivos_zipar"
    - "baixar_arquivo"

cowork:
  max_concurrent_tasks: 3     # máximo de tarefas simultâneas em segundo plano
  max_steps: 40               # passos de ferramenta por tarefa (navegação incluída)
  workspace_dir: "data/cowork"  # uma pasta por tarefa: artefatos + resultado.md
  auto_resume: true           # retoma tarefas interrompidas ao iniciar
  fechar_abas: true           # ao concluir, fecha as abas do grupo da tarefa

browser:
  enabled: true               # controle do navegador (Playwright)
  motor_padrao: "chrome"      # edge | chrome
  headless: true              # navegador interno: a tela aparece na conversa
  realismo: true              # ponteiro se movendo, destaque, digitação visível
  digitar_ms: 35              # atraso por caractere ao digitar
  viewport: {width: 1280, height: 800}
  timeout_ms: 15000           # espera por elemento em cada ação
  nav_timeout_ms: 45000       # espera por navegação/carregamento
  snapshot_text_chars: 3000   # quanto texto da página vai para o modelo
  max_elements: 120           # máximo de elementos interativos por snapshot
  # Um motor por navegador, cada um com perfil persistente próprio.
  # mode=launch abre o navegador real; mode=cdp anexa a um já aberto com
  # --remote-debugging-port (use navegador_conectar para iniciar).
  engines:
    edge:
      channel: "msedge"
      profile_dir: "data/browser_profiles/edge"
      mode: "launch"
      cdp_url: "http://127.0.0.1:9223"
    chrome:
      channel: "chrome"
      profile_dir: "data/browser_profiles/chrome-cdp"
      mode: "cdp"
      cdp_url: "http://127.0.0.1:9222"

# --------------------------------------------------------------------- #
# Rede local — alcance de dispositivos (câmeras, TVs, celulares, IoT)
# Por padrão o agente só alcança as sub-redes DIRETAMENTE conectadas a esta
# máquina. Nada de internet aberta: allow_public existe, mas é explícito.
# --------------------------------------------------------------------- #
rede:
  habilitado: true
  allowed_subnets: []         # vazio = detecta as sub-redes locais da máquina
  allowed_hosts: []           # IPs/hostnames extras (ex.: "192.168.15.42")
  allow_public: false         # true = permite alvos fora da rede local (assuma o risco)
  max_hosts: 254              # teto de hosts por varredura
  scan_timeout_ms: 650        # timeout da sondagem completa de portas
  probe_timeout_ms: 350       # timeout da 1ª fase (achar hosts vivos)
  concurrency: 256            # sondagens simultâneas
  portas: [80, 443, 554, 1883, 3000, 3001, 5000, 8000, 8001, 8080,
           8081, 8443, 8554, 9000, 9100, 37777, 62078]
  ssdp_segundos: 3            # janela de descoberta UPnP/SSDP
  mdns_segundos: 4            # janela de descoberta mDNS (Chromecast, ONVIF…)
  ffmpeg: "ffmpeg"            # usado para snapshots RTSP de câmeras
  rtsp_transport: "udp"       # tcp | udp (Yoosee costuma exigir udp)
  monitoramento: true         # varredura contínua em segundo plano
  intervalo_monitor_s: 180    # a cada 3 minutos
  auto_gerenciar: true        # YVAKOR organiza/testa sozinho (manual tem prioridade)
  adb: "adb"                  # usado para celulares Android (opcional)
  mqtt:
    host: ""                  # ex.: 192.168.15.10 (broker da casa)
    port: 1883
    user: ""
    password: ""
    tls: false

# --------------------------------------------------------------------- #
# Voz — falar e ouvir
# --------------------------------------------------------------------- #
notificacoes:
  ativo: true
  categorias: [rede, tarefa, camera, sistema, receita, dispositivo]
  silencio: ["23:00", "07:00"]
  intervalo_min_s: 8

voz:
  habilitado: true
  idioma: "pt-BR"
  idiomas: ["pt-BR", "es-ES"]
  modelos:
    pt-BR: "vosk-model-small-pt-0.3"
    es-ES: "vosk-model-small-es-0.42"
  stt: "auto"                 # auto | vosk | sapi
  modelo_vosk: "vosk-model-small-pt-0.3"   # baixado sob demanda (~31 MB)
  modelo_dir: "data/vosk"
  tts: "auto"                 # auto | edge | sapi
  voz_edge: "pt-BR-AntonioNeural"
  vozes:
    pt-BR: "pt-BR-AntonioNeural"
    es-ES: "es-ES-AlvaroNeural"
  voz_sapi: ""                # vazio = melhor voz masculina pt-BR instalada
  velocidade: 0               # (legado: passos de 10%) — vale se "taxa" estiver vazio e efeito=nenhum
  taxa: "-5%"                 # cadência: levemente pausada (voz de comando)
  tom: "-12Hz"                # grave; o Antonio é o único pt-BR masculino neural
  efeito: "assinatura"        # assinatura = EQ de estúdio + compressão + nível fixo; nenhum = voz crua
  escuta_segundos: 7          # tempo máximo de uma fala
  silencio_rms: 0.012         # abaixo disso conta como silêncio
  silencio_fim_ms: 900        # silêncio contínuo que encerra a escuta
  palavra_ativacao: "yvakor"  # vazio = desliga o modo por palavra-chave
  sessao_segundos: 45         # segue a conversa sem repetir a palavra-chave
  narrar: true                # fala o que está fazendo durante a tarefa

# --------------------------------------------------------------------- #
# Cérebro — vault markdown estilo Obsidian, indexado em SQLite/FTS5
# Abra data/vault/ no Obsidian: notas com [[wikilinks]], tags e grafo.
# --------------------------------------------------------------------- #
cerebro:
  habilitado: true
  vault_dir: "data/vault"
  exportar_conversas: true    # cada conversa vira uma nota (resumo + últimas msgs)
  max_conversas: 50           # quantas conversas exportar por sincronização
  max_memorias: 300           # quantos fatos viram notas
  resposta_direta: true       # responde do cérebro sem IA quando souber
  limiar_direto: 0.7          # confiança mínima p/ resposta sem IA
  limiar_local: 0.65          # confiança mínima p/ usar o modelo local
  receitas: true              # permite executar skills com receita aprovada
  receitas_simular: false     # true = só mostra o plano, sem executar

maintenance:
  enabled: true               # auto-manutenção em segundo plano
  interval_hours: 12          # de quanto em quanto tempo roda o ciclo
  consolidate_memory: true    # dedup/limpeza da memória semântica (usa a IA)
  # --- Atualização do próprio código (via git, opcional e seguro) ---
  auto_update_code: false     # true = faz 'git pull' sozinho quando houver versão nova
  git_remote: "origin"
  git_branch: "main"

# Visão local (Ollama) para analisar imagens/telas sem API externa.
visao:
  ativa: true
  modelo: "moondream"         # modelo de visão instalado no Ollama
  timeout_s: 90
