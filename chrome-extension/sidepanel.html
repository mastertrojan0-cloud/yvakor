<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YVAKOR</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topo">
    <div class="marca">Y</div>
    <div class="marca-texto">
      <h1>YVAKOR</h1>
      <p id="assinatura">para Chrome</p>
    </div>
    <span id="status" class="pill">conectando</span>
    <select id="modelo" title="Modelo de IA" aria-label="Modelo de IA"></select>
    <button id="voz" title="Ativar voz">🔇</button>
    <button id="nova" title="Nova conversa">+</button>
  </header>

  <div class="contexto" id="contexto">
    <span class="ctx-dot"></span>
    <span id="ctx-titulo">Lendo a página…</span>
  </div>

  <main class="painel">
    <div class="chat" id="chat">
      <div class="vazio" id="vazio">
        <div class="simbolo">Y</div>
        <h2>Como posso ajudar?</h2>
        <p>Peça para navegar, explicar a página, pesquisar ou executar uma
           tarefa no Chrome.</p>
      </div>
    </div>
    <section id="confirmacao" class="confirmacao oculto" role="alertdialog"
             aria-live="assertive" aria-labelledby="conf-topo">
      <div id="conf-topo" class="conf-topo">AÇÃO PROTEGIDA · PRECISA DA SUA RESPOSTA</div>
      <div id="conf-acao" class="conf-acao"></div>
      <div id="conf-detalhe" class="conf-detalhe"></div>
      <div id="conf-prazo" class="conf-prazo"></div>
      <div class="conf-botoes">
        <button id="conf-negar" type="button">Negar</button>
        <button id="conf-permitir" type="button">Permitir</button>
      </div>
    </section>
    <section id="processo" class="processo oculto">
      <div class="proc-topo"><span>PROCESSO</span><span id="proc-status">—</span></div>
      <div id="passos" class="passos"></div>
    </section>
  </main>

  <footer class="composer">
    <textarea id="entrada" rows="2" placeholder="Pergunte ou peça uma ação…"></textarea>
    <button id="mic" title="Ditar">🎙</button>
    <button id="enviar">Enviar</button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
